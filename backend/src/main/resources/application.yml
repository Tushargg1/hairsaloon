media:
  storage-provider: "${MEDIA_STORAGE_PROVIDER:disabled}"
  object-prefix: "${MEDIA_OBJECT_PREFIX:salons}"
  cdn-base-url: "${MEDIA_CDN_BASE_URL:}"
  presign-ttl: "${MEDIA_PRESIGN_TTL:5m}"
  s3:
    bucket: "${MEDIA_S3_BUCKET:}"
    region: "${MEDIA_S3_REGION:us-east-1}"

spring:
  application:
    name: groomit-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hairsaloon}
    username: ${POSTGRES_USER:hairsaloon}
    password: ${POSTGRES_PASSWORD:hairsaloon}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

app:
  base-domain: ${BASE_DOMAIN:groomit.in}
  platform-hosts: ${PLATFORM_HOSTS:groomit.in,www.groomit.in}
  tenant-cache-ttl: 5m
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:https://groomit.in}"
    allowed-origin-patterns: "${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.groomit.in}"
  auth:
    jwt:
      secret: "${JWT_SECRET:}"
      issuer: "${JWT_ISSUER:groomit}"
      ttl: "${JWT_TTL:8h}"
    cookie:
      domain: "${AUTH_COOKIE_DOMAIN:}"
      secure: "${AUTH_COOKIE_SECURE:true}"
    security:
      hmac-secret: "${APP_AUTH_SECURITY_HMAC_SECRET:}"
    rate-limit:
      max-attempts: "${AUTH_RATE_LIMIT_MAX_ATTEMPTS:5}"
      window: "${AUTH_RATE_LIMIT_WINDOW:5m}"
      redis-enabled: "${AUTH_RATE_LIMIT_REDIS_ENABLED:true}"
      key-prefix: "${AUTH_RATE_LIMIT_KEY_PREFIX:groomit:auth:rate:}"
    otp:
      code-length: "${OTP_CODE_LENGTH:6}"
      max-attempts: "${OTP_MAX_ATTEMPTS:5}"
      challenge-ttl: "${OTP_CHALLENGE_TTL:10m}"
      proof-ttl: "${OTP_PROOF_TTL:5m}"
      resend-delay: "${OTP_RESEND_DELAY:60s}"
      allow-code-logging: "${OTP_ALLOW_CODE_LOGGING:false}"
      expose-code: false
      require-signup-verification: "${OTP_REQUIRE_SIGNUP_VERIFICATION:true}"
    bootstrap-platform-admin:
      enabled: "${PLATFORM_ADMIN_BOOTSTRAP_ENABLED:false}"
      email: "${PLATFORM_ADMIN_BOOTSTRAP_EMAIL:}"
      password: "${PLATFORM_ADMIN_BOOTSTRAP_PASSWORD:}"
  push:
    enabled: "${PUSH_ENABLED:false}"
    provider: "${PUSH_PROVIDER:disabled}"
    batch-size: "${PUSH_OUTBOX_BATCH_SIZE:25}"
    max-attempts: "${PUSH_MAX_ATTEMPTS:8}"
    claim-duration: "${PUSH_CLAIM_DURATION:2m}"
    base-retry-delay: "${PUSH_BASE_RETRY_DELAY:30s}"
    max-retry-delay: "${PUSH_MAX_RETRY_DELAY:30m}"
    process-delay-ms: "${PUSH_PROCESS_DELAY_MS:5000}"
    vapid-public-key: "${VAPID_PUBLIC_KEY:}"
    vapid-private-key: "${VAPID_PRIVATE_KEY:}"
    vapid-subject: "${VAPID_SUBJECT:}"
  notifications:
    provider: "${EMAIL_PROVIDER:logging}"
    from: "${EMAIL_FROM:}"
    resend-api-key: "${RESEND_API_KEY:}"
    batch-size: "${EMAIL_OUTBOX_BATCH_SIZE:25}"
    max-attempts: "${EMAIL_MAX_ATTEMPTS:6}"
    claim-duration: "${EMAIL_CLAIM_DURATION:2m}"
    base-retry-delay: "${EMAIL_BASE_RETRY_DELAY:30s}"
    max-retry-delay: "${EMAIL_MAX_RETRY_DELAY:30m}"
    scheduling-enabled: "${EMAIL_SCHEDULING_ENABLED:true}"
    reminder-scan-delay-ms: "${EMAIL_REMINDER_SCAN_DELAY_MS:60000}"
    process-delay-ms: "${EMAIL_PROCESS_DELAY_MS:5000}"
