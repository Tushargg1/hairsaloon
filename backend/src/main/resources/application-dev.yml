spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: false

server:
  error:
    include-message: always

management:
  health:
    redis:
      enabled: false

logging:
  level:
    com.hairsaloon: DEBUG

app:
  base-domain: localhost
  platform-hosts: localhost,www.localhost
  cors:
    allowed-origins: http://localhost:5173
    allowed-origin-patterns: http://*.localhost:[*]
  auth:
    cookie:
      domain: ""
      secure: false
    otp:
      allow-code-logging: true

media:
  storage-provider: disabled
