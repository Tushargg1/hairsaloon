spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:4}
      connection-timeout: 30000
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  error:
    include-message: never

logging:
  level:
    root: INFO
    com.hairsaloon: INFO
