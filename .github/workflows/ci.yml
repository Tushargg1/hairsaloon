name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: groomit
          POSTGRES_USER: groomit
          POSTGRES_PASSWORD: groomit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U groomit -d groomit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/groomit
      POSTGRES_USER: groomit
      POSTGRES_PASSWORD: groomit
      TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/groomit
      TEST_POSTGRES_USERNAME: groomit
      TEST_POSTGRES_PASSWORD: groomit
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: dev
      BASE_DOMAIN: lvh.me
      PLATFORM_HOSTS: lvh.me,www.lvh.me
      CORS_ALLOWED_ORIGINS: http://lvh.me:5173,http://www.lvh.me:5173
      CORS_ALLOWED_ORIGIN_PATTERNS: http://*.lvh.me:5173
      JWT_SECRET: raw:ci-only-secret-that-is-at-least-sixty-four-bytes-long-and-never-used-outside-ci
      JWT_ISSUER: groomit-ci
      AUTH_COOKIE_DOMAIN: .lvh.me
      AUTH_COOKIE_SECURE: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure local test hosts
        run: echo "127.0.0.1 lvh.me www.lvh.me" | sudo tee -a /etc/hosts

      - name: Verify backend
        working-directory: backend
        run: ./mvnw -B verify

      - name: Assert PostgreSQL integration tests ran
        working-directory: backend
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          expected = {
              "com.hairsaloon.tenantdata.BookingConcurrencyIT",
              "com.hairsaloon.tenantdata.ReviewConcurrencyIT",
              "com.hairsaloon.testsupport.PostgreSqlMigrationSmokeIT",
          }
          suites = {}
          for report in glob.glob("target/failsafe-reports/TEST-*.xml"):
              root = ET.parse(report).getroot()
              suites[root.attrib.get("name", "")] = root
          errors = []
          for name in sorted(expected):
              suite = suites.get(name)
              if suite is None:
                  errors.append(f"missing Failsafe XML report for {name}")
                  continue
              tests = int(suite.attrib.get("tests", "0"))
              skipped = int(suite.attrib.get("skipped", "0"))
              failures = int(suite.attrib.get("failures", "0"))
              errors_count = int(suite.attrib.get("errors", "0"))
              if tests == 0 or skipped != 0 or failures != 0 or errors_count != 0:
                  errors.append(
                      f"{name}: tests={tests} skipped={skipped} "
                      f"failures={failures} errors={errors_count}")
              else:
                  print(f"POSTGRES_IT_REPORT_CONFIRMED={name} tests={tests}")
          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend
        working-directory: backend
        run: nohup ./mvnw -B spring-boot:run > ../backend-e2e.log 2>&1 &
      - name: Wait for backend health
        run: |
          for attempt in {1..60}; do
            curl --fail --silent http://lvh.me:8080/actuator/health && exit 0
            sleep 2
          done
          cat backend-e2e.log
          exit 1
      - name: Run Playwright Chromium
        working-directory: frontend
        continue-on-error: true
        run: npm run e2e

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          if-no-files-found: ignore
          path: |
            backend-e2e.log
            frontend/playwright-report/
            frontend/test-results/
